<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE RACE - HSK 2 Vocabulary Challenge</title>
  <style>
    :root {
      --primary-yellow: #FFD000;
      --primary-dark-yellow: #E6B800;
      --bg-light-yellow: #FFFDF0;
      --accent-orange: #FF8800;
      --dark-text: #2C2C2C;
      --light-text: #FFFFFF;
      --card-bg: #FFFFFF;
      --correct-green: #2E7D32;
      --correct-bg: #E8F5E9;
      --wrong-red: #C62828;
      --wrong-bg: #FFEBEE;
      --border-radius: 16px;
      --shadow: 0 8px 24px rgba(255, 180, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-light-yellow);
      color: var(--dark-text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    #game-container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      border: 3px solid var(--primary-yellow);
      overflow: hidden;
      position: relative;
      min-height: 520px;
      display: flex;
      flex-direction: column;
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      padding: 24px;
      flex-grow: 1;
    }

    .screen.active {
      display: flex;
    }

    /* Headers & Typography */
    h1 {
      font-size: 2.5rem;
      color: var(--accent-orange);
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0px var(--primary-yellow);
      text-align: center;
    }

    h2 {
      font-size: 1.2rem;
      color: #666;
      text-align: center;
      margin-bottom: 20px;
    }

    /* Buttons */
    .btn {
      background: var(--primary-yellow);
      color: var(--dark-text);
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background: var(--primary-dark-yellow);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      background: #E0E0E0;
      color: #333;
    }
    .btn-secondary:hover {
      background: #D0D0D0;
    }

    /* Screen 1: Start Screen */
    #start-screen {
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 15px;
    }

    .runner-icon {
      font-size: 4rem;
      margin-bottom: 10px;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

    /* Category Grids (Play & Learn) */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
      gap: 12px;
      margin-top: 10px;
      max-height: 380px;
      overflow-y: auto;
      padding: 5px;
    }

    .cat-btn {
      background: var(--bg-light-yellow);
      border: 2px solid var(--primary-yellow);
      border-radius: 12px;
      padding: 12px 0;
      font-weight: bold;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--dark-text);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cat-btn span {
      font-size: 0.75rem;
      color: #888;
      font-weight: normal;
    }

    .cat-btn:hover {
      background: var(--primary-yellow);
      transform: scale(1.05);
    }

    .cat-btn.active {
      background: var(--primary-yellow);
      border-color: var(--accent-orange);
    }

    /* Gameplay */
    .race-track-container {
      background: #FFF8D6;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--primary-yellow);
    }

    .race-track-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: bold;
      color: #555;
      margin-bottom: 6px;
    }

    .track {
      height: 20px;
      background: #E0E0E0;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
    }

    .runner-progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary-yellow), var(--accent-orange));
      border-radius: 10px;
      transition: width 0.4s ease-in-out;
    }

    .question-box {
      background: var(--bg-light-yellow);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      border: 2px dashed var(--primary-yellow);
    }

    .question-type-badge {
      font-size: 0.8rem;
      text-transform: uppercase;
      background: var(--primary-yellow);
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .question-prompt {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }

    .option-btn {
      background: #FFF;
      border: 2px solid #E0E0E0;
      border-radius: 10px;
      padding: 14px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      line-height: 1.3;
    }

    .option-btn:hover {
      border-color: var(--primary-yellow);
      background: var(--bg-light-yellow);
    }

    /* Feedback Overlay */
    .feedback-box {
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      display: none;
      margin-bottom: 15px;
    }

    .feedback-box.correct {
      background: var(--correct-bg);
      color: var(--correct-green);
      border: 1px solid var(--correct-green);
    }

    .feedback-box.incorrect {
      background: var(--wrong-bg);
      color: var(--wrong-red);
      border: 1px solid var(--wrong-red);
    }

    .feedback-word {
      font-weight: bold;
      font-size: 1.1rem;
      margin-top: 4px;
    }

    /* Victory Screen */
    #victory-screen {
      text-align: center;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .victory-trophy {
      font-size: 5rem;
      animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    .nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .back-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #666;
    }

    /* NEW: Learn Section Specific Styles */
    .learn-letter-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 10px 0;
      margin-bottom: 15px;
      border-bottom: 2px solid var(--bg-light-yellow);
    }

    .letter-tab-btn {
      background: var(--bg-light-yellow);
      border: 1px solid var(--primary-yellow);
      border-radius: 8px;
      padding: 6px 12px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .letter-tab-btn.active, .letter-tab-btn:hover {
      background: var(--primary-yellow);
      color: var(--dark-text);
    }

    .vocab-list-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      max-height: 380px;
      padding-right: 4px;
    }

    .vocab-card {
      background: var(--bg-light-yellow);
      border: 2px solid var(--primary-yellow);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .vocab-card:hover {
      box-shadow: 0 4px 12px rgba(255, 180, 0, 0.3);
      transform: translateY(-2px);
    }

    .vocab-hanzi {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--dark-text);
      margin-bottom: 4px;
    }

    .vocab-pinyin {
      font-size: 1.1rem;
      color: var(--accent-orange);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .vocab-meaning {
      font-size: 0.95rem;
      color: #555;
      background: #FFF;
      padding: 6px 12px;
      border-radius: 6px;
      display: inline-block;
      border: 1px dashed var(--primary-dark-yellow);
    }

    .vocab-card.hidden-meaning .vocab-meaning-text {
      visibility: hidden;
      position: relative;
    }

    .vocab-card.hidden-meaning .vocab-meaning-text::after {
      content: "Tap to reveal meaning";
      visibility: visible;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #999;
      font-style: italic;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    @media (max-width: 480px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
      h1 { font-size: 2rem; }
      .question-prompt { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<div id="game-container">
  
  <!-- SCREEN 1: START SCREEN -->
  <div id="start-screen" class="screen active">
    <div class="runner-icon">🏃💨</div>
    <h1>THE RACE</h1>
    <h2>HSK 2 Vocabulary Challenge</h2>
    <div style="display: flex; flex-direction: column; gap: 12px; width: 220px; margin: 0 auto;">
      <button class="btn" onclick="showScreen('category-screen')">Start / Play</button>
      <button class="btn btn-secondary" onclick="openLearnSection()">📖 Learn</button>
    </div>
  </div>

  <!-- SCREEN 2: CATEGORY SELECTION -->
  <div id="category-screen" class="screen">
    <div class="nav-header">
      <button class="back-btn" onclick="showScreen('start-screen')">⬅</button>
      <h2 style="margin:0;">Select Pinyin Category</h2>
      <div style="width:24px;"></div>
    </div>
    <div class="category-grid" id="category-grid"></div>
  </div>

  <!-- SCREEN 3: GAMEPLAY -->
  <div id="game-screen" class="screen">
    <div class="nav-header">
      <button class="back-btn" onclick="confirmExit()">⬅</button>
      <span id="category-title" style="font-weight: bold; color: var(--accent-orange);"></span>
      <div></div>
    </div>

    <div class="race-track-container">
      <div class="race-track-info">
        <span>Progress</span>
        <span id="race-progress-text">0 / 0</span>
      </div>
      <div class="track">
        <div class="runner-progress" id="runner-progress"></div>
      </div>
    </div>

    <div class="question-box">
      <div class="question-type-badge" id="question-badge">Type</div>
      <div class="question-prompt" id="question-prompt">...</div>
    </div>

    <div class="options-grid" id="options-grid"></div>

    <div id="feedback-box" class="feedback-box">
      <div id="feedback-status" style="font-weight: bold;"></div>
      <div id="feedback-detail" class="feedback-word"></div>
    </div>

    <button id="next-btn" class="btn" style="display: none; width: 100%; margin-top: auto;" onclick="nextQuestion()">Next Question ➔</button>
  </div>

  <!-- SCREEN 4: VICTORY -->
  <div id="victory-screen" class="screen">
    <div class="victory-trophy">🏆</div>
    <h1>VICTORY!</h1>
    <h2>You completed the category race!</h2>
    <p id="victory-stats" style="margin-bottom: 15px; color: #555;"></p>
    <div style="display:flex; gap: 10px;">
      <button class="btn" onclick="restartCategory()">Play Again</button>
      <button class="btn btn-secondary" onclick="showScreen('category-screen')">Categories</button>
    </div>
  </div>

  <!-- SCREEN 5: NEW LEARN SECTION -->
  <div id="learn-screen" class="screen">
    <div class="nav-header">
      <button class="back-btn" onclick="showScreen('start-screen')">⬅</button>
      <h2 style="margin:0;">HSK 2 Vocabulary Practice</h2>
      <div style="width:24px;"></div>
    </div>

    <!-- Letter Switching Ribbon -->
    <div class="learn-letter-nav" id="learn-letter-nav"></div>

    <!-- Scrollable Vocab Cards Container -->
    <div class="vocab-list-container" id="vocab-list-container"></div>
  </div>

</div>

  // Utility: Helper to clean Pinyin for letter categorization
  function getFirstLetter(pinyin) {
    const clean = pinyin.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
    return clean.charAt(0).toUpperCase();
  }

  // Categorize database dynamically by First Letter
  const categories = {};
  rawVocabulary.forEach(item => {
    const letter = getFirstLetter(item.pinyin);
    if (!categories[letter]) {
      categories[letter] = [];
    }
    categories[letter].push(item);
  });

  // State Variables
  let currentCategoryKey = "";
  let currentWords = [];
  let currentQuestionIndex = 0;
  let correctAnswersCount = 0;
  let currentQuestionObj = null;
  let currentLearnLetter = "";

  // Render Available Categories for Gameplay
  function renderCategories() {
    const grid = document.getElementById('category-grid');
    grid.innerHTML = '';
    const sortedKeys = Object.keys(categories).sort();

    sortedKeys.forEach(letter => {
      const count = categories[letter].length;
      const btn = document.createElement('button');
      btn.className = 'cat-btn';
      btn.innerHTML = `${letter} <span>(${count})</span>`;
      btn.onclick = () => startRace(letter);
      grid.appendChild(btn);
    });
  }

  // Navigation Logic
  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function confirmExit() {
    if (confirm("Quit this race and return to category selection?")) {
      showScreen('category-screen');
    }
  }

  // Game Core Functions
  function startRace(letterCategory) {
    currentCategoryKey = letterCategory;
    currentWords = [...categories[letterCategory]];
    // Shuffle array for randomness
    currentWords.sort(() => Math.random() - 0.5);
    
    currentQuestionIndex = 0;
    correctAnswersCount = 0;
    
    document.getElementById('category-title').innerText = `Category: ${letterCategory}`;
    showScreen('game-screen');
    loadQuestion();
  }

  function restartCategory() {
    startRace(currentCategoryKey);
  }

  function updateProgress() {
    const total = currentWords.length;
    const progressPercent = Math.min(100, Math.round((currentQuestionIndex / total) * 100));
    document.getElementById('runner-progress').style.width = `${progressPercent}%`;
    document.getElementById('race-progress-text').innerText = `${currentQuestionIndex} / ${total}`;
  }

  function loadQuestion() {
    updateProgress();
    
    // Check Victory
    if (currentQuestionIndex >= currentWords.length) {
      document.getElementById('victory-stats').innerText = `You mastered all ${currentWords.length} words in category ${currentCategoryKey}!`;
      showScreen('victory-screen');
      return;
    }

    // Hide Next Button and Reset Feedback
    document.getElementById('next-btn').style.display = 'none';
    const feedbackBox = document.getElementById('feedback-box');
    feedbackBox.style.display = 'none';
    feedbackBox.className = 'feedback-box';

    const targetWord = currentWords[currentQuestionIndex];
    
    // Select Random Question Type
    const types = ['hanzi_to_en', 'en_to_hanzi', 'pinyin_to_hanzi', 'hanzi_to_pinyin'];
    const selectedType = types[Math.floor(Math.random() * types.length)];
    
    currentQuestionObj = generateQuestionData(targetWord, selectedType);
    
    // Render UI
    document.getElementById('question-badge').innerText = currentQuestionObj.typeLabel;
    document.getElementById('question-prompt').innerText = currentQuestionObj.prompt;
    
    const optionsGrid = document.getElementById('options-grid');
    optionsGrid.innerHTML = '';
    
    currentQuestionObj.options.forEach((opt) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt;
      btn.onclick = () => checkAnswer(opt, currentQuestionObj.correctAnswer, targetWord);
      optionsGrid.appendChild(btn);
    });
  }

  function generateQuestionData(target, type) {
    let prompt = "";
    let typeLabel = "";
    let correctAnswer = "";
    let distractorsOptions = [];

    // Generate 3 plausible distractors from whole dataset
    const distractors = getDistractors(target);

    switch(type) {
      case 'hanzi_to_en':
        typeLabel = "Chinese ➔ English";
        prompt = target.hanzi;
        correctAnswer = target.viet;
        distractorsOptions = distractors.map(d => d.viet);
        break;
      case 'en_to_hanzi':
        typeLabel = "English ➔ Chinese";
        prompt = target.viet;
        correctAnswer = target.hanzi;
        distractorsOptions = distractors.map(d => d.hanzi);
        break;
      case 'pinyin_to_hanzi':
        typeLabel = "Pinyin ➔ Chinese";
        prompt = target.pinyin;
        correctAnswer = target.hanzi;
        distractorsOptions = distractors.map(d => d.hanzi);
        break;
      case 'hanzi_to_pinyin':
        typeLabel = "Chinese ➔ Pinyin";
        prompt = target.hanzi;
        correctAnswer = target.pinyin;
        distractorsOptions = distractors.map(d => d.pinyin);
        break;
    }

    const options = [correctAnswer, ...distractorsOptions].sort(() => Math.random() - 0.5);

    return { typeLabel, prompt, correctAnswer, options };
  }

  function getDistractors(target) {
    const distractors = [];
    while (distractors.length < 3) {
      const randomWord = rawVocabulary[Math.floor(Math.random() * rawVocabulary.length)];
      if (randomWord.stt !== target.stt && !distractors.some(d => d.stt === randomWord.stt)) {
        distractors.push(randomWord);
      }
    }
    return distractors;
  }

  function checkAnswer(selectedOption, correctAnswer, targetWord) {
    const feedbackBox = document.getElementById('feedback-box');
    const feedbackStatus = document.getElementById('feedback-status');
    const feedbackDetail = document.getElementById('feedback-detail');
    const optionBtns = document.querySelectorAll('.option-btn');

    optionBtns.forEach(btn => btn.disabled = true);

    if (selectedOption === correctAnswer) {
      feedbackBox.className = 'feedback-box correct';
      feedbackStatus.innerText = '✓ Correct!';
      feedbackDetail.innerText = `${targetWord.hanzi} [${targetWord.pinyin}] : ${targetWord.viet}`;
      correctAnswersCount++;
    } else {
      feedbackBox.className = 'feedback-box incorrect';
      feedbackStatus.innerText = '✗ Incorrect!';
      feedbackDetail.innerText = `Correct answer: ${targetWord.hanzi} [${targetWord.pinyin}] = ${targetWord.viet}`;
    }

    feedbackBox.style.display = 'block';
    document.getElementById('next-btn').style.display = 'block';
  }

  function nextQuestion() {
    currentQuestionIndex++;
    loadQuestion();
  }

  // NEW: Learn Section Functions
  function openLearnSection() {
    const sortedKeys = Object.keys(categories).sort();
    if (!currentLearnLetter || !categories[currentLearnLetter]) {
      currentLearnLetter = sortedKeys[0];
    }
    renderLearnNav();
    renderLearnVocab(currentLearnLetter);
    showScreen('learn-screen');
  }

  function renderLearnNav() {
    const nav = document.getElementById('learn-letter-nav');
    nav.innerHTML = '';
    const sortedKeys = Object.keys(categories).sort();

    sortedKeys.forEach(letter => {
      const btn = document.createElement('button');
      btn.className = `letter-tab-btn ${letter === currentLearnLetter ? 'active' : ''}`;
      btn.innerText = `${letter} (${categories[letter].length})`;
      btn.onclick = () => {
        currentLearnLetter = letter;
        renderLearnNav();
        renderLearnVocab(letter);
      };
      nav.appendChild(btn);
    });
  }

  function renderLearnVocab(letter) {
    const container = document.getElementById('vocab-list-container');
    container.innerHTML = '';
    const words = categories[letter] || [];

    words.forEach(word => {
      const card = document.createElement('div');
      card.className = 'vocab-card hidden-meaning';
      card.innerHTML = `
        <div class="vocab-hanzi">${word.hanzi}</div>
        <div class="vocab-pinyin">${word.pinyin}</div>
        <div class="vocab-meaning">
          <span class="vocab-meaning-text">${word.viet}</span>
        </div>
      `;
      card.onclick = () => {
        card.classList.toggle('hidden-meaning');
      };
      container.appendChild(card);
    });
  }

  // Initialization
  renderCategories();
</script>
