<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE RACE - HSK 2 Vocabulary Challenge</title>
  <style>
    :root {
      --primary-yellow: #FFD000;
      --primary-dark-yellow: #E6B800;
      --bg-light-yellow: #FFFDF0;
      --accent-orange: #FF8800;
      --dark-text: #2C2C2C;
      --light-text: #FFFFFF;
      --card-bg: #FFFFFF;
      --correct-green: #2E7D32;
      --correct-bg: #E8F5E9;
      --wrong-red: #C62828;
      --wrong-bg: #FFEBEE;
      --border-radius: 16px;
      --shadow: 0 8px 24px rgba(255, 180, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-light-yellow);
      color: var(--dark-text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    #game-container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      border: 3px solid var(--primary-yellow);
      overflow: hidden;
      position: relative;
      min-height: 520px;
      display: flex;
      flex-direction: column;
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      padding: 24px;
      flex-grow: 1;
    }

    .screen.active {
      display: flex;
    }

    /* Headers & Typography */
    h1 {
      font-size: 2.5rem;
      color: var(--accent-orange);
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0px var(--primary-yellow);
      text-align: center;
    }

    h2 {
      font-size: 1.2rem;
      color: #666;
      text-align: center;
      margin-bottom: 20px;
    }

    /* Buttons */
    .btn {
      background: var(--primary-yellow);
      color: var(--dark-text);
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background: var(--primary-dark-yellow);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      background: #E0E0E0;
      color: #333;
    }
    .btn-secondary:hover {
      background: #D0D0D0;
    }

    /* Screen 1: Start Screen */
    #start-screen {
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 20px;
    }

    .runner-icon {
      font-size: 4rem;
      margin-bottom: 10px;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

    /* Screen 2: Category Selection */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
      gap: 12px;
      margin-top: 10px;
      max-height: 380px;
      overflow-y: auto;
      padding: 5px;
    }

    .cat-btn {
      background: var(--bg-light-yellow);
      border: 2px solid var(--primary-yellow);
      border-radius: 12px;
      padding: 12px 0;
      font-weight: bold;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--dark-text);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cat-btn span {
      font-size: 0.75rem;
      color: #888;
      font-weight: normal;
    }

    .cat-btn:hover {
      background: var(--primary-yellow);
      transform: scale(1.05);
    }

    /* Screen 3: Gameplay */
    .race-track-container {
      background: #FFF8D6;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--primary-yellow);
    }

    .race-track-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: bold;
      color: #555;
      margin-bottom: 6px;
    }

    .track {
      height: 20px;
      background: #E0E0E0;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
    }

    .runner-progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary-yellow), var(--accent-orange));
      border-radius: 10px;
      transition: width 0.4s ease-in-out;
    }

    .question-box {
      background: var(--bg-light-yellow);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      border: 2px dashed var(--primary-yellow);
    }

    .question-type-badge {
      font-size: 0.8rem;
      text-transform: uppercase;
      background: var(--primary-yellow);
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .question-prompt {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }

    .option-btn {
      background: #FFF;
      border: 2px solid #E0E0E0;
      border-radius: 10px;
      padding: 14px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      line-height: 1.3;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary-yellow);
      background: var(--bg-light-yellow);
    }

    .option-btn.correct-choice {
      background-color: var(--correct-bg);
      border-color: var(--correct-green);
      color: var(--correct-green);
      font-weight: bold;
    }

    .option-btn.wrong-choice {
      background-color: var(--wrong-bg);
      border-color: var(--wrong-red);
      color: var(--wrong-red);
    }

    /* Feedback Box */
    .feedback-box {
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      display: none;
      margin-bottom: 15px;
    }

    .feedback-box.correct {
      background: var(--correct-bg);
      color: var(--correct-green);
      border: 1px solid var(--correct-green);
    }

    .feedback-box.incorrect {
      background: var(--wrong-bg);
      color: var(--wrong-red);
      border: 1px solid var(--wrong-red);
    }

    .feedback-word {
      font-weight: bold;
      font-size: 1.1rem;
      margin-top: 4px;
    }

    /* Screen 4: Victory */
    #victory-screen {
      text-align: center;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .victory-trophy {
      font-size: 5rem;
      animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    .nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .back-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #666;
    }

    @media (max-width: 480px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
      h1 { font-size: 2rem; }
      .question-prompt { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<div id="game-container">
  
  <!-- SCREEN 1: START SCREEN -->
  <div id="start-screen" class="screen active">
    <div class="runner-icon">🏃💨</div>
    <h1>THE RACE</h1>
    <h2>HSK 2 Vocabulary Challenge</h2>
    <button class="btn" onclick="showScreen('category-screen')">Start / Play</button>
  </div>

  <!-- SCREEN 2: CATEGORY SELECTION -->
  <div id="category-screen" class="screen">
    <div class="nav-header">
      <button class="back-btn" onclick="showScreen('start-screen')">⬅</button>
      <h2 style="margin:0;">Select Pinyin Category</h2>
      <div style="width:24px;"></div>
    </div>
    <div class="category-grid" id="category-grid"></div>
  </div>

  <!-- SCREEN 3: GAMEPLAY -->
  <div id="game-screen" class="screen">
    <div class="nav-header">
      <button class="back-btn" onclick="confirmExit()">⬅</button>
      <span id="category-title" style="font-weight: bold; color: var(--accent-orange);"></span>
      <div></div>
    </div>

    <div class="race-track-container">
      <div class="race-track-info">
        <span>Progress</span>
        <span id="race-progress-text">0 / 0</span>
      </div>
      <div class="track">
        <div class="runner-progress" id="runner-progress"></div>
      </div>
    </div>

    <div class="question-box">
      <div class="question-type-badge" id="question-badge">Hanzi ➔ Meaning</div>
      <div class="question-prompt" id="question-prompt">...</div>
    </div>

    <div class="options-grid" id="options-grid"></div>

    <div id="feedback-box" class="feedback-box">
      <div id="feedback-status" style="font-weight: bold;"></div>
      <div id="feedback-detail" class="feedback-word"></div>
    </div>

    <button id="next-btn" class="btn" style="display: none; width: 100%; margin-top: auto;" onclick="nextQuestion()">Next Question ➔</button>
  </div>

  <!-- SCREEN 4: VICTORY -->
  <div id="victory-screen" class="screen">
    <div class="victory-trophy">🏆</div>
    <h1>VICTORY!</h1>
    <h2>You completed the category race!</h2>
    <p id="victory-stats" style="margin-bottom: 15px; color: #555;"></p>
    <div style="display:flex; gap: 10px;">
      <button class="btn" onclick="restartCategory()">Play Again</button>
      <button class="btn btn-secondary" onclick="showScreen('category-screen')">Categories</button>
    </div>
  </div>

</div>

    { stt: 305, hanzi: "举手", pinyin: "jūshõu", viet: "giơ tay" },
    { stt: 306, hanzi: "举行", pinyin: "jùxíng", viet: "tổ chức" },
    { stt: 307, hanzi: "句", pinyin: "jù", viet: "câu" },
    { stt: 308, hanzi: "句子", pinyin: "jùzi", viet: "câu" },
    { stt: 309, hanzi: "卡", pinyin: "kă", viet: "thẻ, vé" },
    { stt: 310, hanzi: "开机", pinyin: "kāijī", viet: "mở máy" },
    { stt: 311, hanzi: "开心", pinyin: "kāixīn", viet: "vui vẻ" },
    { stt: 312, hanzi: "开学", pinyin: "kāixué", viet: "khai giảng" },
    { stt: 313, hanzi: "看法", pinyin: "kàn fă", viet: "cách nhìn" },
    { stt: 314, hanzi: "考生", pinyin: "kǎoshēng", viet: "thí sinh" },
    { stt: 315, hanzi: "靠", pinyin: "kào", viet: "dựa vào" },
    { stt: 316, hanzi: "科", pinyin: "kē", viet: "môn, khoa" },
    { stt: 317, hanzi: "科学", pinyin: "kēxué", viet: "khoa học" },
    { stt: 318, hanzi: "可爱", pinyin: "kěài", viet: "đáng yêu" },
    { stt: 319, hanzi: "可能", pinyin: "kěnéng", viet: "khả năng" },
    { stt: 320, hanzi: "可怕", pinyin: "kěpà", viet: "đáng sợ" },
    { stt: 321, hanzi: "可是", pinyin: "kěshì", viet: "nhưng mà" },
    { stt: 322, hanzi: "可以", pinyin: "kěyi", viet: "có thể" },
    { stt: 323, hanzi: "克", pinyin: "kè", viet: "gam" },
    { stt: 324, hanzi: "刻", pinyin: "kè", viet: "15 phút" }
  ];

  // Helper function to extract initial letter (ignoring tone accents)
  function getInitialLetter(pinyin) {
    const normalize = pinyin.normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
    return normalize.charAt(0).toUpperCase();
  }

  // Game state
  let currentCategory = "";
  let categoryQuestions = [];
  let currentIndex = 0;
  let correctCount = 0;

  // Navigation
  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function confirmExit() {
    if (confirm("Are you sure you want to exit the current race?")) {
      showScreen('category-screen');
    }
  }

  // Build Categories
  function initCategoryScreen() {
    const grid = document.getElementById('category-grid');
    grid.innerHTML = '';

    const categoriesMap = {};
    rawVocabulary.forEach(item => {
      const letter = getInitialLetter(item.pinyin);
      if (!categoriesMap[letter]) categoriesMap[letter] = 0;
      categoriesMap[letter]++;
    });

    const sortedLetters = Object.keys(categoriesMap).sort();

    sortedLetters.forEach(letter => {
      const btn = document.createElement('button');
      btn.className = 'cat-btn';
      btn.innerHTML = `${letter} <span>(${categoriesMap[letter]} words)</span>`;
      btn.onclick = () => startRace(letter);
      grid.appendChild(btn);
    });
  }

  // Helper shuffle array
  function shuffle(array) {
    return array.slice().sort(() => Math.random() - 0.5);
  }

  // Start Race Session
  function startRace(letter) {
    currentCategory = letter;
    document.getElementById('category-title').innerText = `Category: ${letter}`;
    
    // Filter words in selected category
    categoryQuestions = rawVocabulary.filter(item => getInitialLetter(item.pinyin) === letter);
    categoryQuestions = shuffle(categoryQuestions);

    currentIndex = 0;
    correctCount = 0;

    showScreen('game-screen');
    renderQuestion();
  }

  function restartCategory() {
    startRace(currentCategory);
  }

  // Render current question
  function renderQuestion() {
    const feedbackBox = document.getElementById('feedback-box');
    const nextBtn = document.getElementById('next-btn');
    feedbackBox.style.display = 'none';
    nextBtn.style.display = 'none';

    const total = categoryQuestions.length;
    document.getElementById('race-progress-text').innerText = `${currentIndex} / ${total}`;
    document.getElementById('runner-progress').style.width = `${(currentIndex / total) * 100}%`;

    if (currentIndex >= total) {
      showVictory();
      return;
    }

    const item = categoryQuestions[currentIndex];
    
    // Randomize question mode: 0 = Hanzi->Viet, 1 = Viet->Hanzi
    const mode = Math.random() < 0.5 ? 'hanzi-to-viet' : 'viet-to-hanzi';
    const badge = document.getElementById('question-badge');
    const prompt = document.getElementById('question-prompt');

    if (mode === 'hanzi-to-viet') {
      badge.innerText = 'Hanzi ➔ Meaning';
      prompt.innerText = item.hanzi;
    } else {
      badge.innerText = 'Meaning ➔ Hanzi';
      prompt.innerText = item.viet;
    }

    // Pick 3 distractor choices from all vocab
    const otherWords = rawVocabulary.filter(w => w.stt !== item.stt);
    const distractors = shuffle(otherWords).slice(0, 3);

    const options = shuffle([item, ...distractors]);
    const optionsGrid = document.getElementById('options-grid');
    optionsGrid.innerHTML = '';

    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = mode === 'hanzi-to-viet' 
        ? opt.viet 
        : `${opt.hanzi} (${opt.pinyin})`;

      btn.onclick = () => selectOption(btn, opt, item, mode);
      optionsGrid.appendChild(btn);
    });
  }

  function selectOption(selectedBtn, selectedItem, correctItem, mode) {
    // Disable all options
    const allBtns = document.querySelectorAll('.option-btn');
    allBtns.forEach(b => b.disabled = true);

    const isCorrect = selectedItem.stt === correctItem.stt;
    const feedbackBox = document.getElementById('feedback-box');
    const statusText = document.getElementById('feedback-status');
    const detailText = document.getElementById('feedback-detail');

    if (isCorrect) {
      selectedBtn.classList.add('correct-choice');
      feedbackBox.className = 'feedback-box correct';
      statusText.innerText = '✨ Correct!';
      correctCount++;
    } else {
      selectedBtn.classList.add('wrong-choice');
      feedbackBox.className = 'feedback-box incorrect';
      statusText.innerText = '❌ Incorrect';

      // Highlight correct button
      allBtns.forEach(b => {
        const text = mode === 'hanzi-to-viet' ? correctItem.viet : `${correctItem.hanzi} (${correctItem.pinyin})`;
        if (b.innerText === text) {
          b.classList.add('correct-choice');
        }
      });
    }

    detailText.innerText = `${correctItem.hanzi} [${correctItem.pinyin}] : ${correctItem.viet}`;
    feedbackBox.style.display = 'block';

    const nextBtn = document.getElementById('next-btn');
    nextBtn.style.display = 'block';
  }

  function nextQuestion() {
    currentIndex++;
    renderQuestion();
  }

  function showVictory() {
    document.getElementById('runner-progress').style.width = '100%';
    document.getElementById('victory-stats').innerText = 
      `You answered ${correctCount} out of ${categoryQuestions.length} questions correctly!`;
    showScreen('victory-screen');
  }

  // Initialize on page load
  window.onload = () => {
    initCategoryScreen();
  };
</script>
</body>
</html>
